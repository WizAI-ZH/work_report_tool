name: Flutter Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    runs-on: ubuntu-latest
    needs: test
    env:
      USE_ALIYUN_MIRROR: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create --project-name work_report_generator --platforms=android .
      - name: Enable Android network permission
        run: |
          manifest="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "android.permission.INTERNET" "$manifest"; then
            perl -0pi -e 's/<manifest([^>]*)>/<manifest$1>\n    <uses-permission android:name="android.permission.INTERNET" \/>/' "$manifest"
          fi
      - run: flutter pub get
      # 恢复签名 keystore 到 android/app/debug.keystore（build.gradle.kts 显式读取此路径）。
      # 不依赖 Android Gradle Plugin 默认的 ~/.android/debug.keystore 路径查找，
      # 因为 CI 环境 ANDROID_SDK_HOME/HOME 不一致会导致查找路径不同。
      - name: Restore Android signing keystore
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 -d > android/app/debug.keystore
          # 验证 keystore 恢复成功（Java 17+ 输出 "SHA-1"，旧版输出 "SHA1"）
          keytool -list -keystore android/app/debug.keystore -storepass android -alias androiddebugkey | grep -E "SHA.?1" || exit 1
      # --split-per-abi 产出 3 个 APK：app-arm64-v8a-release.apk / app-armeabi-v7a-release.apk / app-x86_64-release.apk
      - run: flutter build apk --release --split-per-abi
      - uses: actions/upload-artifact@v4
        with:
          name: WorkReportGenerator_android_apk
          path: build/app/outputs/flutter-apk/app-*-release.apk

  windows:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create --project-name work_report_generator --platforms=windows .
      - run: flutter pub get
      - run: flutter build windows --release
      - run: flutter pub run msix:create
      # 安装 NSIS（GitHub Actions windows-latest 未预装）
      - name: Setup NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress
      # 用 NSIS 打包散文件为 .exe 安装器（支持 /S 静默安装 + 自动重启）
      - name: Build NSIS installer
        shell: pwsh
        run: |
          $Version = (Select-String -Path pubspec.yaml -Pattern '^version:' | Select-Object -First 1).Line -replace 'version:\s*','' -replace '\+.*',''
          $SourceDir = (Resolve-Path "build\windows\x64\runner\Release").Path
          $IconPath = (Resolve-Path "windows\runner\resources\app_icon.ico").Path
          $OutFile = (Join-Path (Get-Location).Path "dist\WorkReportGenerator_windows_setup.exe")
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $MakeNSIS = Get-Command makensis -ErrorAction SilentlyContinue
          if (-not $MakeNSIS) {
            $MakeNSIS = Get-Command "C:\Program Files (x86)\NSIS\makensis.exe" -ErrorAction SilentlyContinue
          }
          & $MakeNSIS.Source `
            "-DVERSION=$Version" `
            "-DSOURCE_DIR=$SourceDir" `
            "-DICON_PATH=$IconPath" `
            "-DOUT_FILE=$OutFile" `
            "installer\windows\nsis\wiz_work_report_tool.nsi"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: WorkReportGenerator_windows
          path: |
            build/windows/x64/runner/Release/**
            build/windows/x64/runner/Release/*.msix
            dist/WorkReportGenerator_windows_setup.exe

  macos:
    runs-on: macos-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create --project-name work_report_generator --platforms=macos .
      - name: Enable macOS network entitlement
        run: |
          for entitlement in macos/Runner/DebugProfile.entitlements macos/Runner/Release.entitlements; do
            if ! grep -q "com.apple.security.network.client" "$entitlement"; then
              perl -0pi -e 's#</dict>#    <key>com.apple.security.network.client</key>\n    <true/>\n</dict>#' "$entitlement"
            fi
          done
      - run: flutter pub get
      - run: flutter build macos --release
      - name: Create dmg
        run: |
          mkdir -p dist
          # Flutter 输出的 .app 名称可能因版本不同而变化，先查找实际路径
          APP_PATH=$(find build/macos/Build/Products/Release -maxdepth 1 -name "*.app" | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "No .app found in build/macos/Build/Products/Release/"
            ls -la build/macos/Build/Products/Release/ || true
            exit 1
          fi
          echo "Found app: $APP_PATH"
          hdiutil create -volname WorkReportGenerator -srcfolder "$APP_PATH" -ov -format UDZO dist/WorkReportGenerator_macos.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: WorkReportGenerator_macos
          path: dist/WorkReportGenerator_macos.dmg

  release:
    runs-on: ubuntu-latest
    needs: [android, windows, macos]
    steps:
      - uses: actions/checkout@v4
      - name: Read version from pubspec.yaml
        id: ver
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | head -1 | awk '{print $2}' | cut -d '+' -f 1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Prepare release assets
        run: |
          mkdir -p release
          # Android: 3 个 split APK，重命名为标准格式 WorkReportGenerator_android_<abi>_<version>.apk
          for apk in artifacts/WorkReportGenerator_android_apk/app-*-release.apk; do
            basename=$(basename "$apk")
            # app-arm64-v8a-release.apk → arm64-v8a
            abi=$(echo "$basename" | sed -E 's/app-(.+)-release\.apk/\1/')
            cp "$apk" "release/WorkReportGenerator_android_${abi}_${{ steps.ver.outputs.version }}.apk"
          done
          # macOS dmg
          mv artifacts/WorkReportGenerator_macos/WorkReportGenerator_macos.dmg \
             release/WorkReportGenerator_macos_${{ steps.ver.outputs.version }}.dmg
          # Windows: 优先上传 NSIS .exe 安装器（应用内更新优先匹配 .exe，支持 /S 静默安装）
          # setup.exe 可能在 artifact 根目录或 dist/ 子目录（取决于 upload-artifact 路径保留）
          SETUP_EXE=$(find artifacts/WorkReportGenerator_windows -name "*setup.exe" -o -name "*_setup.exe" | head -1)
          if [ -n "$SETUP_EXE" ]; then
            cp "$SETUP_EXE" \
               release/WorkReportGenerator_${{ steps.ver.outputs.version }}_windows_setup.exe
          fi
          # Windows 散文件打包成 zip（备用，兼容旧版本应用的 endsWith('_windows.zip') 匹配）
          # 排除 setup.exe 和 msix，它们已单独上传
          cd artifacts/WorkReportGenerator_windows
          zip -r "../../release/WorkReportGenerator_${{ steps.ver.outputs.version }}_windows.zip" . \
            -x "WorkReportGenerator_windows_setup.exe" "dist/*" "*.msix"
          cd ../..
          # 同时附带 msix（如果存在）
          MSIX_FILE=$(find artifacts/WorkReportGenerator_windows -name "*.msix" | head -1)
          if [ -n "$MSIX_FILE" ]; then
            mv "$MSIX_FILE" \
               release/WorkReportGenerator_${{ steps.ver.outputs.version }}_windows.msix
          fi
      - name: Extract changelog section for this version
        id: notes
        run: |
          VERSION=${{ steps.ver.outputs.version }}
          # 提取 ## [VERSION] 到下一个 ## [ 之间的内容作为 release notes
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" {p=1; next}
            p && /^## \[/ {p=0}
            p {print}
          ' CHANGELOG.md > release_notes.md
          # 如果提取为空，使用默认说明
          if [ ! -s release_notes.md ]; then
            echo "Release $VERSION" > release_notes.md
          fi
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ steps.ver.outputs.tag }} \
            --repo "$GITHUB_REPOSITORY" \
            --title "威智工作汇报器 ${{ steps.ver.outputs.version }}" \
            --notes-file release_notes.md \
            --latest \
            release/*
