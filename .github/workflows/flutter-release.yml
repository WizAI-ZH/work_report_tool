name: Flutter Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    runs-on: ubuntu-latest
    needs: test
    env:
      USE_ALIYUN_MIRROR: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create --project-name work_report_generator --platforms=android .
      - name: Enable Android network permission
        run: |
          manifest="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "android.permission.INTERNET" "$manifest"; then
            perl -0pi -e 's/<manifest([^>]*)>/<manifest$1>\n    <uses-permission android:name="android.permission.INTERNET" \/>/' "$manifest"
          fi
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: WorkReportGenerator_android_apk
          path: build/app/outputs/flutter-apk/app-release.apk

  windows:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create --project-name work_report_generator --platforms=windows .
      - run: flutter pub get
      - run: flutter build windows --release
      - run: flutter pub run msix:create
      - uses: actions/upload-artifact@v4
        with:
          name: WorkReportGenerator_windows
          path: |
            build/windows/x64/runner/Release/**
            build/windows/x64/runner/Release/*.msix

  macos:
    runs-on: macos-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create --project-name work_report_generator --platforms=macos .
      - name: Enable macOS network entitlement
        run: |
          for entitlement in macos/Runner/DebugProfile.entitlements macos/Runner/Release.entitlements; do
            if ! grep -q "com.apple.security.network.client" "$entitlement"; then
              perl -0pi -e 's#</dict>#    <key>com.apple.security.network.client</key>\n    <true/>\n</dict>#' "$entitlement"
            fi
          done
      - run: flutter pub get
      - run: flutter build macos --release
      - name: Create dmg
        run: |
          mkdir -p dist
          # Flutter 输出的 .app 名称可能因版本不同而变化，先查找实际路径
          APP_PATH=$(find build/macos/Build/Products/Release -maxdepth 1 -name "*.app" | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "No .app found in build/macos/Build/Products/Release/"
            ls -la build/macos/Build/Products/Release/ || true
            exit 1
          fi
          echo "Found app: $APP_PATH"
          hdiutil create -volname WorkReportGenerator -srcfolder "$APP_PATH" -ov -format UDZO dist/WorkReportGenerator_macos.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: WorkReportGenerator_macos
          path: dist/WorkReportGenerator_macos.dmg

  release:
    runs-on: ubuntu-latest
    needs: [android, windows, macos]
    steps:
      - uses: actions/checkout@v4
      - name: Read version from pubspec.yaml
        id: ver
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | head -1 | awk '{print $2}' | cut -d '+' -f 1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Prepare release assets
        run: |
          mkdir -p release
          mv artifacts/WorkReportGenerator_android_apk/app-release.apk \
             release/WorkReportGenerator_android_${{ steps.ver.outputs.version }}.apk
          mv artifacts/WorkReportGenerator_macos/WorkReportGenerator_macos.dmg \
             release/WorkReportGenerator_macos_${{ steps.ver.outputs.version }}.dmg
          # Windows 产物是散文件，打包成 zip
          cd artifacts/WorkReportGenerator_windows
          zip -r "../../release/WorkReportGenerator_windows_${{ steps.ver.outputs.version }}.zip" .
          cd ../..
          # 同时附带 msix（如果存在）
          if [ -f artifacts/WorkReportGenerator_windows/*.msix ]; then
            mv artifacts/WorkReportGenerator_windows/*.msix \
               release/WorkReportGenerator_windows_${{ steps.ver.outputs.version }}.msix
          fi
      - name: Extract changelog section for this version
        id: notes
        run: |
          VERSION=${{ steps.ver.outputs.version }}
          # 提取 ## [VERSION] 到下一个 ## [ 之间的内容作为 release notes
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" {p=1; next}
            p && /^## \[/ {p=0}
            p {print}
          ' CHANGELOG.md > release_notes.md
          # 如果提取为空，使用默认说明
          if [ ! -s release_notes.md ]; then
            echo "Release $VERSION" > release_notes.md
          fi
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ steps.ver.outputs.tag }} \
            --repo "$GITHUB_REPOSITORY" \
            --title "威智工作汇报器 ${{ steps.ver.outputs.version }}" \
            --notes-file release_notes.md \
            --latest \
            release/*
